<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Streaming Log Dashboard</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0f172a;color:#e2e8f0;font-family:Arial,sans-serif}main{max-width:1100px;margin:auto;padding:32px}h1{margin-bottom:8px}p{color:#94a3b8}button{background:#38bdf8;color:#082f49;border:0;border-radius:9px;padding:13px 24px;font-weight:bold;cursor:pointer;margin:20px 0}button:disabled{opacity:.5}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px}.card,.panel{background:#1e293b;padding:24px;border-radius:14px;margin-top:20px}.card strong{font-size:32px;display:block;margin-top:12px}.red{border-top:4px solid #fb7185}.yellow{border-top:4px solid #fbbf24}.purple{border-top:4px solid #a78bfa}.blue{border-top:4px solid #38bdf8}.bar-row{margin:20px 0}.bar-label{display:flex;justify-content:space-between}.track{background:#334155;border-radius:8px;overflow:hidden;margin-top:8px}.fill{height:24px;width:0;transition:width .4s}table{width:100%;border-collapse:collapse}th,td{padding:12px;border-bottom:1px solid #334155;text-align:left}#message{color:#7dd3fc}
</style>
</head>
<body>
<main>
<h1>Streaming Log Pipeline</h1>
<p>Polars LazyFrame + Regex + FastAPI | Log Analiz Paneli</p>
<button id="run" onclick="analyze()">Analizi Başlat</button>
<p id="message">Analiz başlatılmaya hazır.</p>
<section class="cards">
<div class="card blue">Hata / Uyarı Kayıtları<strong id="total">—</strong></div>
<div class="card red">ERROR<strong id="error">—</strong></div>
<div class="card yellow">WARN<strong id="warn">—</strong></div>
<div class="card purple">CRITICAL<strong id="critical">—</strong></div>
</section>
<section class="panel"><h2>Hata Seviyesi Dağılımı</h2><div id="chart"></div></section>
<section class="panel"><h2>HTTP Durum Kodlarına Göre Dağılım</h2><table><thead><tr><th>Seviye</th><th>HTTP Kodu</th><th>Adet</th></tr></thead><tbody id="results"></tbody></table></section>
</main>
<script>
const colors={ERROR:'#fb7185',WARN:'#fbbf24',CRITICAL:'#a78bfa'};
const fmt=n=>n.toLocaleString('tr-TR');
async function analyze(){
  const btn=document.getElementById('run'),msg=document.getElementById('message');
  btn.disabled=true;msg.textContent='Log dosyası analiz ediliyor...';
  try{
    const response=await fetch('/analyze');
    if(!response.ok)throw new Error('HTTP '+response.status);
    const data=await response.json();
    const totals={ERROR:0,WARN:0,CRITICAL:0};
    for(const row of data.error_distribution){if(Object.hasOwn(totals,row.level))totals[row.level]+=row.count;}
    const detected=Object.values(totals).reduce((a,b)=>a+b,0);
    for(const level of Object.keys(totals))document.getElementById(level.toLowerCase()).textContent=fmt(totals[level]);
    document.getElementById('total').textContent=fmt(detected);
    const max=Math.max(...Object.values(totals),1);
    document.getElementById('chart').innerHTML=Object.entries(totals).map(([level,count])=>`<div class="bar-row"><div class="bar-label"><span>${level}</span><b>${fmt(count)}</b></div><div class="track"><div class="fill" style="width:${count/max*100}%;background:${colors[level]}"></div></div></div>`).join('');
    document.getElementById('results').innerHTML=data.error_distribution.map(row=>`<tr><td>${row.level}</td><td>${row.status??'—'}</td><td>${fmt(row.count)}</td></tr>`).join('');
    msg.textContent='Analiz tamamlandı. '+data.total_groups+' grup oluşturuldu.';
  }catch(err){msg.textContent='Hata: '+err.message;}finally{btn.disabled=false;}
}
</script>
</body>
</html>
